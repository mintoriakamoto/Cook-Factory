name: 🐛 Bug report
description: Report a defect in Ferrox Factory
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: input
    id: ferrox-version
    attributes:
      label: Ferrox Version
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      options: [claude, codex, opencode, cursor, copilot, antigravity, windsurf, cline, wayland-core, other]
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS
      options: [macOS, Linux, Windows, other]
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: The actual behavior.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered, minimal, deterministic.
    validations:
      required: true
  - type: dropdown
    id: frequency
    attributes:
      label: Frequency
      options: [Always, Often, Sometimes, Once]
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity/impact
      options: [Critical - data loss or broken build line, High - blocks a workflow, Medium - workaround exists, Low - cosmetic]
    validations:
      required: true
  - type: checkboxes
    id: pii
    attributes:
      label: PII checklist
      options:
        - label: I confirm this report contains no secrets, tokens, or personal data in logs/paste
          required: true
